<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="nexusGrad" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4cd7f6" />
      <stop offset="0.5" stop-color="#a078ff" />
      <stop offset="1" stop-color="#d0bcff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Outer Hexagonal Frame -->
  <polygon points="24,4 42,14 42,34 24,44 6,34 6,14" stroke="url(#nexusGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="#151b2a" fill-opacity="0.8" />
  <!-- Inner Dynamic Circuit Lines -->
  <path d="M14 24 L24 14 L34 24 L24 34 Z" stroke="#7bd0ff" stroke-width="1.5" stroke-dasharray="2 2" fill="none" />
  <circle cx="24" cy="24" r="5" fill="#a078ff" filter="url(#glow)" />
  <circle cx="24" cy="24" r="2" fill="#ffffff" />
  <!-- Micro Satellite Nodes -->
  <circle cx="24" cy="14" r="2" fill="#4cd7f6" />
  <circle cx="34" cy="24" r="2" fill="#d0bcff" />
  <circle cx="24" cy="34" r="2" fill="#4cd7f6" />
  <circle cx="14" cy="24" r="2" fill="#d0bcff" />
</svg>
